## MySQL-backed test profile (schema persists in MySQL)
## IMPORTANT: prefer a dedicated test schema/database (default: store-java_test)
spring.datasource.url=${TEST_MYSQL_URL:jdbc:mysql://localhost:3306/store-java_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_MYSQL_USERNAME:root}
spring.datasource.password=${TEST_MYSQL_PASSWORD:p0o9i8u7   }
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recreate schema for each test run so CHECK constraints match enum codes
spring.jpa.hibernate.ddl-auto=create-drop

# Ensure Spring Boot test slice doesn't auto-replace with embedded DB
spring.test.database.replace=none
