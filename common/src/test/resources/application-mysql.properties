## MySQL-backed test profile (schema persists in MySQL)
spring.datasource.url=${TEST_MYSQL_URL:jdbc:mysql://localhost:3306/store-java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_MYSQL_USERNAME:root}
spring.datasource.password=${TEST_MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep schema around for inspection
spring.jpa.hibernate.ddl-auto=update

# Ensure Spring Boot test slice doesn't auto-replace with embedded DB
spring.test.database.replace=none
