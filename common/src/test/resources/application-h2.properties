## H2-backed test profile (embedded/in-memory)
spring.datasource.url=jdbc:h2:mem:store-java-common-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Allow @DataJpaTest to use embedded database
spring.test.database.replace=any

# Let Hibernate create schema in-memory for each test run
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false
